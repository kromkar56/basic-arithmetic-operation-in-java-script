        let a = Number(prompt("enter first number:"));

        let b = Number(prompt("enter second number:"));

        alert("result:" +  result)}
          
       else if (d == "-"){
         result  = a  - b;
        alert("result:" +  result);}

        else if (d == "*"){
         result  = a  * b;
        alert("result:" +  result)}

        else if (d == "/"){
         result  = a  / b;
        alert("result:" +  result)}

         
         else if (d !="+" + "-" +"*" +"/" ){
         result  = "invalid operator"
         alert( result);}


    </script>
